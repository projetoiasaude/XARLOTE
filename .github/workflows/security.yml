name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # toda segunda 06:00 UTC

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo pra varrer commits antigos
      # Usamos o binário OSS direto (MIT) em vez da gitleaks-action@v2, que
      # exige GITLEAKS_LICENSE para repositórios de organização.
      - name: Run gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --verbose --exit-code 1

  audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # DoD F1.D4: "CVE crítico bloqueia merge". High/moderate são acompanhados
      # via Dependabot (PRs automáticos), sem travar todo merge.
      - name: Audit (bloqueia em critical)
        run: pnpm audit --audit-level critical
