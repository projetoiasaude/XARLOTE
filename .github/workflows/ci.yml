name: CI

on:
  # Todo branch, não só `main`. Em 22/09/2026 a auditoria achou 84 commits de PRODUÇÃO
  # vivendo só no Mac do fundador, em `fix/auditoria-set` — um branch que o CI nunca viu,
  # porque o gatilho era só `main`. Gate que não roda no branch que deploya não é gate.
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      # Web é excluído do build (precisa de envs de build-time do Next que
      # vivem na Vercel, não no CI) — mesmo critério do nixpacks.toml.
      - name: Build (api + worker + libs)
        run: pnpm --filter '!@iasaude/web' -r build

  lint:
    name: lint (informativo até F1.C5)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r --if-present lint
