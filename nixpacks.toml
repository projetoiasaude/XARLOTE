[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
# Builda apenas API + worker + libs compartilhadas (NÃO o apps/web — Next.js
# precisa de envs de build-time que não estão no Railway dessa service, e
# o web roda em outro lugar).
cmds = ["pnpm --filter '!@iasaude/web' -r build"]

[start]
# API agora roda os workers (reminder-dispatcher, profile-enricher,
# conversation-compactor) no mesmo processo Node — concurrently quebrava
# o healthcheck do Railway. Tudo num único processo é mais simples e
# confiável pro container do Railway.
cmd = "pnpm --filter @iasaude/api start"
